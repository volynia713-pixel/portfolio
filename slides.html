<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Презентации проектов | Valeriy</title>
    <style>
        :root {
            --bg: #050505;
            --surface: rgba(255, 255, 255, 0.04);
            --accent: #00ffa3;
            --text: #ffffff;
            --text-dim: #999;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .back-link:hover { opacity: 0.7; }
        .back-link.hidden { display: none; }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: var(--text-dim); margin-bottom: 40px; }

        .presentation-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }
        .presentation-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .presentation-item:hover {
            border-color: var(--accent);
            transform: translateX(8px);
        }
        .presentation-item .info h3 {
            margin: 0 0 8px 0;
            font-size: 1.3rem;
        }
        .presentation-item .info p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .presentation-item .arrow {
            font-size: 28px;
            color: var(--accent);
        }

        .slider-view {
            display: none;
            flex-direction: column;
            height: 85vh;
        }
        .slider-view.active {
            display: flex;
        }
        .back-to-list {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            padding: 12px 0;
            text-align: left;
            width: fit-content;
            margin-bottom: 16px;
        }
        .slider-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider-container img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 32px;
            width: 56px;
            height: 80px;
            border-radius: 16px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: rgba(0,0,0,0.8);
            border-color: var(--accent);
        }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }
        .counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-family: monospace;
        }

        @media (max-width: 640px) {
            .container { padding: 20px 15px; }
            .presentation-item { padding: 18px 20px; }
            .nav-btn { width: 44px; height: 60px; font-size: 28px; }
            .nav-prev { left: 8px; }
            .nav-next { right: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link" id="backLink">← Назад в портфолио</a>
        <h1>Презентации проектов</h1>

        <div id="presentationList" class="presentation-list"></div>

        <div id="sliderView" class="slider-view">
            <button class="back-to-list" onclick="showList()">← Назад к списку</button>
            <div class="slider-container">
                <button class="nav-btn nav-prev" id="prevBtn">◀</button>
                <img id="slideImage" src="" alt="Слайд">
                <button class="nav-btn nav-next" id="nextBtn">▶</button>
                <div class="counter" id="counter">1 / 1</div>
            </div>
        </div>
    </div>

    <script>
        const presentations = [
            {
                id: 1,
                title: "Персонализация искусства в каждой квартире",
                description: "Презентация проекта для конкурса «Креативная экономика» — федеральный центр по поддержке и развитию креативных индустрий",
                slides: [
                   "slides/personal art_1.webp",
                   "slides/personal art_2.webp",
                   "slides/personal art_3.webp",
				   "slides/personal art_4.webp",
                   "slides/personal art_5.webp",
                   "slides/personal art_6.webp",
				   "slides/personal art_7.webp",
                   "slides/personal art_8.webp"
	]
            },
            {
                id: 2,
                title: "AI театр",
                description: "Презентация проекта для конкурса «Креативная экономика» — федеральный центр по поддержке и развитию креативных индустрий",
                slides: [
                   "slides/AI Theater_1.webp",
                   "slides/AI Theater_2.webp",
                   "slides/AI Theater_3.webp",
				   "slides/AI Theater_4.webp",
                   "slides/AI Theater_5.webp",
                   "slides/AI Theater_6.webp",
				   "slides/AI Theater_7.webp"
    ]
            },
			{
                id: 3,
                title: "Vertera",
                description: "Vertera - продукция для красоты и здоровья из ламинарии",
                slides: [
                   "slides/vertera_1.webp",
                   "slides/vertera_2.webp",
				   "slides/vertera_3.webp",
                   "slides/vertera_4.webp",
                   "slides/vertera_5.webp",
				   "slides/vertera_6.webp",
                   "slides/vertera_7.webp",
				   "slides/vertera_8.webp",
				   "slides/vertera_9.webp",
				   "slides/vertera_10.webp"
	]
},
        ];

        let currentPresentation = null;
        let currentSlideIndex = 0;

        function renderList() {
            const container = document.getElementById('presentationList');
            container.innerHTML = presentations.map(p => `
                <div class="presentation-item" onclick="openPresentation(${p.id})">
                    <div class="info">
                        <h3>${p.title}</h3>
                        <p>${p.description}</p>
                    </div>
                    <div class="arrow">→</div>
                </div>
            `).join('');
        }

        function openPresentation(id) {
            currentPresentation = presentations.find(p => p.id === id);
            if (!currentPresentation || !currentPresentation.slides.length) return;
            currentSlideIndex = 0;
            updateSlide();
            document.getElementById('presentationList').style.display = 'none';
            document.getElementById('sliderView').classList.add('active');
            // Скрываем верхнюю кнопку
            document.getElementById('backLink').classList.add('hidden');
        }

        function showList() {
            document.getElementById('presentationList').style.display = 'flex';
            document.getElementById('sliderView').classList.remove('active');
            // Показываем верхнюю кнопку
            document.getElementById('backLink').classList.remove('hidden');
        }

        function updateSlide() {
            const img = document.getElementById('slideImage');
            const counter = document.getElementById('counter');
            if (currentPresentation && currentPresentation.slides.length) {
                img.src = currentPresentation.slides[currentSlideIndex];
                counter.innerText = `${currentSlideIndex + 1} / ${currentPresentation.slides.length}`;
            }
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (!currentPresentation) return;
            currentSlideIndex = (currentSlideIndex - 1 + currentPresentation.slides.length) % currentPresentation.slides.length;
            updateSlide();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (!currentPresentation) return;
            currentSlideIndex = (currentSlideIndex + 1) % currentPresentation.slides.length;
            updateSlide();
        });

        let touchStart = 0;
        document.addEventListener('touchstart', (e) => { touchStart = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            if (!currentPresentation) return;
            const delta = e.changedTouches[0].screenX - touchStart;
            if (Math.abs(delta) > 50) {
                if (delta > 0) document.getElementById('prevBtn').click();
                else document.getElementById('nextBtn').click();
            }
        });

        renderList();
    </script>
</body>
</html>
